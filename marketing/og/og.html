<!doctype html>
<!--
  Source for public/og.png — the 1200x630 card every link preview shows.

  A real banner, not the favicon: a square logo gets letterboxed or
  centre-cropped by every platform that renders a link card, which is how a
  shared link ends up looking like a stray icon.

  Re-render with:  node marketing/og/render.mjs
  Then bump the ?v= in src/lib/seo/page-metadata.ts — WhatsApp, LinkedIn and
  Facebook cache the image by URL for weeks.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Geist, -apple-system, system-ui, sans-serif;
    background: #ffffff;
    color: #141414;
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 76px;
  }
  /* The same hairline grid and crimson bloom as the site's hero, so a link
     preview and the page it opens are recognisably one thing. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(20,20,20,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(20,20,20,.05) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
  }
  .bloom {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(60% 55% at 50% 0%, rgba(196,31,34,.20) 0%, transparent 70%),
      radial-gradient(90% 75% at 50% 12%, rgba(196,31,34,.07) 0%, transparent 75%);
  }
  .inner { position: relative; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 44px; }
  .brand svg { width: 52px; height: 52px; }
  .name { font-size: 32px; font-weight: 900; letter-spacing: -.02em; }
  .name span { color: #C41F22; }
  h1 {
    font-size: 84px; line-height: 1.02; font-weight: 900; letter-spacing: -.045em;
    max-width: 960px;
  }
  h1 em { font-style: normal; color: #C41F22; position: relative; }
  h1 em::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 7px;
    border-radius: 99px;
    background: linear-gradient(to right, #C41F22 0%, #C41F22 70%, transparent 100%);
    box-shadow: 0 0 26px 3px rgba(196,31,34,.34);
  }
  p.sub { margin-top: 40px; font-size: 27px; line-height: 1.45; color: #5d5d5d; max-width: 880px; }
  .foot {
    position: absolute; left: 76px; right: 76px; bottom: 48px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 20px; font-weight: 500; color: #5d5d5d;
  }
  .pill {
    background: rgba(196,31,34,.1); color: #C41F22; font-weight: 700;
    padding: 9px 18px; border-radius: 99px; font-size: 19px;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="bloom"></div>

  <div class="inner">
    <div class="brand">
      <svg viewBox="0 0 32 32">
        <defs><linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E4443C"/><stop offset=".55" stop-color="#C41F22"/><stop offset="1" stop-color="#8E1418"/>
        </linearGradient></defs>
        <path d="M16 1.6c.52 0 .95.23 1.24.63C20.1 6.1 26.6 14.3 26.6 19.7a10.6 10.6 0 0 1-21.2 0c0-5.4 6.5-13.6 9.36-17.47.29-.4.72-.63 1.24-.63Z" fill="url(#d)"/>
        <path d="M9.5 15.9C7.9 20.9 10.9 25.6 15.4 26.3v-1.75C12.3 23.8 10 20.6 9.5 15.9ZM22.5 15.9c1.6 5-1.4 9.7-5.9 10.4v-1.75c3.1-.75 5.4-3.95 5.9-8.65Z" fill="#fff"/>
        <path d="M16 23.1c-3.9-2.5-5.5-4.8-5.2-6.8.3-2 2.7-2.9 4.3-1.6l.9.8.9-.8c1.6-1.3 4-.4 4.3 1.6.3 2-1.3 4.3-5.2 6.8Z" fill="#fff"/>
        <path d="M15.3 16.4h1.4v1.3H18v1.4h-1.3v1.3h-1.4v-1.3H14v-1.4h1.3Z" fill="#C41F22"/>
      </svg>
      <span class="name">BLOOD<span>OC</span></span>
    </div>

    <h1>Roll up a sleeve,<br><em>save three lives.</em></h1>
    <p class="sub">Register in two minutes.</p>
  </div>

  <div class="foot">
    <span>bloodoc.life</span>
    <span class="pill">GIVE BLOOD, GIVE LIFE</span>
  </div>
</body>
</html>
